# Plivo webhook + WebSocket proxy for the aie26 deployment (port 5001).
# Mirrors recsys.conf but on the /aie26 path so both run side by side.
ProxyPass /aie26/ws/voice ws://127.0.0.1:5001/aie26/ws/voice
ProxyPassReverse /aie26/ws/voice ws://127.0.0.1:5001/aie26/ws/voice

ProxyPass /aie26/ http://127.0.0.1:5001/aie26/
ProxyPassReverse /aie26/ http://127.0.0.1:5001/aie26/

# Required modules: mod_proxy mod_proxy_http mod_proxy_wstunnel
