# Plivo webhook + WebSocket proxy for RecsYS
ProxyPass /recsys/ws/voice ws://127.0.0.1:5000/recsys/ws/voice
ProxyPassReverse /recsys/ws/voice ws://127.0.0.1:5000/recsys/ws/voice

ProxyPass /recsys/ http://127.0.0.1:5000/recsys/
ProxyPassReverse /recsys/ http://127.0.0.1:5000/recsys/

# Required modules: mod_proxy mod_proxy_http mod_proxy_wstunnel
