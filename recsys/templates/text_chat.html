<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oak & Ivy — Text to Order</title>
<style>
  :root{ --orange:#E8772E; --blue:#2563EB; --ink:#1f2430; --bg:#eef1f6; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:1000px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 360px;gap:18px}
  .bar{grid-column:1/-1;background:var(--orange);color:#fff;border-radius:14px;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
  .bar h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.5px}
  .bar a{color:#fff;text-decoration:none;font-size:13px;opacity:.9}
  .panel{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .chat{display:flex;flex-direction:column;height:70vh}
  .msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:78%;padding:10px 14px;border-radius:16px;line-height:1.35;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
  .msg.user{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
  .msg.bot{align-self:flex-start;background:#f1f3f8;color:var(--ink);border-bottom-left-radius:4px}
  .msg a{color:inherit;text-decoration:underline}
  .input{display:flex;gap:10px;padding:14px;border-top:1px solid #eee}
  .input input{flex:1;border:1px solid #d7dbe4;border-radius:10px;padding:12px 14px;font-size:15px;outline:none}
  .input input:focus{border-color:var(--blue)}
  .input button{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:0 20px;font-size:15px;font-weight:600;cursor:pointer}
  .input button:disabled{opacity:.5;cursor:default}
  .receipt{padding:18px}
  .receipt h2{font-size:13px;letter-spacing:1px;color:#8a93a6;margin:0 0 12px;text-transform:uppercase}
  .line{display:flex;justify-content:space-between;font-size:14px;padding:7px 0;border-bottom:1px dashed #eceef3}
  .line .mods{font-size:12px;color:#8a93a6}
  .perk{color:var(--orange);font-weight:600}
  .totrow{display:flex;justify-content:space-between;font-weight:700;font-size:17px;margin-top:12px}
  .empty{color:#aab1c0;font-size:14px}
  .hint{grid-column:1/-1;color:#8a93a6;font-size:13px;text-align:center}
  @media(max-width:860px){.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <h1>OAK & IVY — Text to Order</h1>
    <a href="{{ base }}/">&larr; Console</a>
  </div>

  <div class="panel chat">
    <div class="msgs" id="msgs">
      <div class="msg bot">Hi! Welcome to Oak & Ivy. What can I get for you today? (Try texting "VIP")</div>
    </div>
    <div class="input">
      <input id="box" placeholder="Type your message…" autocomplete="off">
      <button id="send">Send</button>
    </div>
  </div>

  <div class="panel receipt">
    <h2>Your Order</h2>
    <div id="lines"><div class="empty">Cart is empty.</div></div>
    <div class="totrow" id="totrow" style="display:none"><span>Total</span><span id="tot">$0.00</span></div>
    <div id="paywrap" style="margin-top:14px;display:none">
      <a id="paylink" href="#" target="_blank" style="display:block;text-align:center;background:var(--orange);color:#fff;text-decoration:none;padding:11px;border-radius:10px;font-weight:600">Complete Payment</a>
    </div>
  </div>

  <div class="hint">Browser test channel — same pipeline as SMS. Owner testing only.</div>
</div>

<script>
const BASE = '{{ base }}';
const SESSION = 'text-' + Math.random().toString(36).slice(2, 10);
const msgs = document.getElementById('msgs');
const box  = document.getElementById('box');
const send = document.getElementById('send');

function linkify(t){
  return t.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
}
function addMsg(text, who){
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.innerHTML = who === 'bot' ? linkify(text) : text.replace(/</g,'&lt;');
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
}
function renderCart(items, total, checkoutUrl){
  const lines = document.getElementById('lines');
  if(!items || !items.length){ lines.innerHTML = '<div class="empty">Cart is empty.</div>';
    document.getElementById('totrow').style.display='none';
    document.getElementById('paywrap').style.display='none'; return; }
  lines.innerHTML = '';
  items.forEach(it => {
    const isPerk = (it.name||'').toLowerCase().includes('vip perk');
    const price = it.price ? '$' + (it.price * (it.quantity||1)).toFixed(2) : (isPerk ? 'FREE' : '');
    const mods = (it.modifiers && it.modifiers.length) ? '<div class="mods">+ ' + it.modifiers.join(', ') + '</div>' : '';
    const row = document.createElement('div');
    row.className = 'line';
    row.innerHTML = `<div class="${isPerk?'perk':''}">${(it.quantity||1)}× ${it.name}${mods}</div><div>${price}</div>`;
    lines.appendChild(row);
  });
  document.getElementById('tot').textContent = '$' + (total||'0.00');
  document.getElementById('totrow').style.display='flex';
  const pw = document.getElementById('paywrap');
  if(checkoutUrl){ document.getElementById('paylink').href = checkoutUrl; pw.style.display='block'; }
  else pw.style.display='none';
}

async function submit(){
  const text = box.value.trim();
  if(!text) return;
  addMsg(text, 'user');
  box.value=''; send.disabled=true;
  try{
    const r = await fetch(`${BASE}/api/text/chat`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message:text, session_id:SESSION})
    });
    const d = await r.json();
    addMsg(d.reply || '…', 'bot');
    renderCart(d.cart_items, d.cart_total, d.checkout_url);
  }catch(e){ addMsg('Sorry, something went wrong.', 'bot'); }
  send.disabled=false; box.focus();
}
send.onclick = submit;
box.addEventListener('keydown', e => { if(e.key==='Enter') submit(); });
box.focus();
</script>
</body>
</html>
