<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMS Test · dev</title>
<style>
  :root{--blue:#2563EB;--ink:#1f2430;--bg:#0f1320;--card:#171c2b;--line:#2a3147;--mut:#8a93a6;--green:#16a34a}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:#e8ecf5;min-height:100vh;padding:20px}
  .wrap{max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:16px}
  h1{font-size:19px;margin:0}
  .tag{font-size:11px;color:#a5631a;background:#2a2113;border:1px solid #4a3a18;border-radius:20px;padding:2px 10px;font-weight:700;margin-left:8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  label{font-size:12px;color:var(--mut);font-weight:600;display:block;margin:10px 0 4px}
  input,textarea,select{width:100%;background:#0e1320;border:1px solid var(--line);color:#e8ecf5;border-radius:9px;padding:11px 13px;font-size:15px;outline:none;font-family:inherit}
  input:focus,textarea:focus{border-color:var(--blue)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  button{margin-top:14px;background:var(--blue);color:#fff;border:none;border-radius:9px;padding:12px 18px;font-size:15px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6}
  .status{font-size:13px;margin-top:8px;min-height:18px}
  .status.ok{color:#43d17a}.status.err{color:#ff7a7a}
  .thread{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow-y:auto}
  .m{padding:9px 12px;border-radius:12px;max-width:80%;font-size:14px;line-height:1.4;word-wrap:break-word}
  .m.out{align-self:flex-end;background:#1e3a8a}
  .m.in{align-self:flex-start;background:#1f2937;border:1px solid var(--line)}
  .m .meta{font-size:10px;color:var(--mut);margin-top:4px}
  .m.failed{background:#3a1d1d;border:1px solid #5a2a2a}
  .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .muted{color:var(--mut);font-size:12px}
  a{color:#7aa2ff}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <h1>SMS Test <span class="tag">DEV ONLY</span></h1>
    <span class="muted">Plivo · numbers you own</span>
  </div>

  <div class="card">
    <label for="from">From (your Plivo number)</label>
    <input id="from" list="numlist" placeholder="+1XXXXXXXXXX" autocomplete="off">
    <datalist id="numlist"></datalist>

    <div class="row">
      <div><label for="to">To</label><input id="to" type="tel" placeholder="+1XXXXXXXXXX"></div>
      <div><label>&nbsp;</label><div class="muted" style="padding-top:11px">Reply capture needs this number's<br>Plivo webhook → <code>/smsTest/inbound</code></div></div>
    </div>

    <label for="text">Message</label>
    <textarea id="text" rows="3" placeholder="Keep it transactional (Plivo spam filter)."></textarea>
    <button id="send">Send SMS</button>
    <div class="status" id="status"></div>
  </div>

  <div class="card">
    <div class="hd"><h1 style="font-size:15px">Thread</h1><button id="refresh" style="margin:0;padding:6px 12px;font-size:12px;background:#222a3d">↻</button></div>
    <div class="thread" id="thread"><div class="muted">No messages yet.</div></div>
    <div class="muted" style="margin-top:8px">Auto-refreshes every 4s · → sent · ← received</div>
  </div>
</div>

<script>
  const BASE = "{{ base }}";
  const KEY  = "{{ key }}";
  const q = s => document.getElementById(s);
  const k = u => u + (u.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(KEY);
  const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  q('from').value = "{{ default_from }}";

  // Populate the From dropdown with the dev's actual Plivo numbers.
  fetch(k(`${BASE}/api/smsTest/numbers`)).then(r=>r.json()).then(d=>{
    const dl = q('numlist'); dl.innerHTML='';
    (d.numbers||[]).forEach(n => { const o=document.createElement('option'); o.value=n; dl.appendChild(o); });
  }).catch(()=>{});

  async function send(){
    const payload = { from:q('from').value.trim(), to:q('to').value.trim(), text:q('text').value.trim() };
    const st = q('status'); st.className='status'; st.textContent='';
    if(!payload.from || !payload.to || !payload.text){ st.className='status err'; st.textContent='From, To and Message are all required.'; return; }
    const b=q('send'); b.disabled=true; b.textContent='Sending…';
    try{
      const r = await fetch(k(`${BASE}/api/smsTest/send`), {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      const d = await r.json();
      if(d.ok){ st.className='status ok'; st.textContent='Sent ✓ '+(d.message_uuid||''); q('text').value=''; }
      else { st.className='status err'; st.textContent='Failed: '+(d.error||d.status||'unknown'); }
    }catch(e){ st.className='status err'; st.textContent='Request failed.'; }
    b.disabled=false; b.textContent='Send SMS'; load();
  }
  q('send').onclick = send;

  async function load(){
    try{
      const d = await (await fetch(k(`${BASE}/api/smsTest/messages`))).json();
      const t = q('thread'); const msgs = (d.messages||[]).slice().reverse();
      if(!msgs.length){ t.innerHTML='<div class="muted">No messages yet.</div>'; return; }
      t.innerHTML='';
      msgs.forEach(m=>{
        const div=document.createElement('div');
        div.className='m '+(m.direction==='out'?'out':'in')+(m.status==='failed'?' failed':'');
        const arrow = m.direction==='out'?'→':'←';
        div.innerHTML = `${esc(m.body)}<div class="meta">${arrow} ${esc(m.from)} → ${esc(m.to)} · ${esc(m.time)}${m.status==='failed'?' · failed':''}</div>`;
        t.appendChild(div);
      });
      t.scrollTop = t.scrollHeight;
    }catch(e){}
  }
  q('refresh').onclick = load;
  load(); setInterval(load, 4000);
</script>
</body>
</html>
